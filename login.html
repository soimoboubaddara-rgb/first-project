<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🔐 تسجيل الدخول</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="topbar glass">
      <div class="brand">💈 <span data-i18n="appName"></span></div>
      <div class="top-actions">
        <button class="btn ghost sm" id="langBtn"></button>
        <a class="btn ghost sm" href="index.html" data-i18n="back"></a>
      </div>
    </header>

    <main class="login-box glass">
      <h1 data-i18n="loginTitle"></h1>
      <p class="muted" data-i18n="loginSub"></p>
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="username" data-i18n="username"></label>
          <input id="username" autocomplete="username" autocapitalize="none" required>
        </div>
        <div class="field">
          <label for="password" data-i18n="password"></label>
          <input id="password" type="password" autocomplete="current-password" required>
        </div>
        <div class="err" id="loginErr"></div>
        <button class="btn block" type="submit" data-i18n="loginBtn"></button>
      </form>
    </main>
  </div>

  <script src="app.js"></script>
  <script src="auth.js"></script>
</body>
</html>
